# ASTRAL Linux Calamares installer configuration.
# This configuration is intended for a future live ISO containing Calamares.
# It is not a substitute for a tested live image or a safe partitioning test.
---
modules-search: [ local ]
instances:
  - id: welcome
    module: welcome
  - id: locale
    module: locale
  - id: keyboard
    module: keyboard
  - id: partition
    module: partition
  - id: users
    module: users
  - id: summary
    module: summary
  - id: bootloader
    module: bootloader
  - id: finished
    module: finished

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
      - bootloader
      - finished
