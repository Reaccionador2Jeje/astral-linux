name: ASTRAL ISO build

on:
  workflow_dispatch:

permissions:
  contents: read

# Penguins' Eggs remasters the running OS and needs real kernel mounts.
# This job must run only on a dedicated, disposable Ubuntu VM runner.
jobs:
  build-classic-iso:
    runs-on: [self-hosted, linux, x64, astral-eggs-vm]
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify dedicated disposable VM
        run: |
          set -eu
          test -f /etc/astral-ephemeral-builder || {
            echo "::error::This runner is not marked as a disposable ASTRAL ISO VM."
            exit 1
          }
          test "$( . /etc/os-release; printf '%s' "${ID:-}" )" = ubuntu
          test "$( . /etc/os-release; printf '%s' "${VERSION_ID:-}" )" = 24.04
          test "$(uname -m)" = x86_64
          test "$(findmnt -n -o FSTYPE /)" != overlay
          command -v sudo >/dev/null
          sudo -n true

      - name: Build ASTRAL Classic with Penguins' Eggs
        run: |
          sudo --preserve-env=ASTRAL_OUT_DIR bash installers/iso/build-iso.sh
        env:
          ASTRAL_OUT_DIR: /home/eggs

      - name: Validate ISO boot catalog
        run: |
          set -eu
          test -s /home/eggs/astral-classic-amd64.iso
          test -s /home/eggs/astral-classic-amd64.iso.sha256
          command -v xorriso
          file /home/eggs/astral-classic-amd64.iso
          xorriso -indev /home/eggs/astral-classic-amd64.iso -report_el_torito plain
          cd /home/eggs
          sha256sum -c astral-classic-amd64.iso.sha256
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp astral-classic-amd64.iso astral-classic-amd64.iso.sha256 "$GITHUB_WORKSPACE/dist/"

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: astral-classic-amd64-iso
          path: |
            dist/astral-classic-amd64.iso
            dist/astral-classic-amd64.iso.sha256
          if-no-files-found: error
